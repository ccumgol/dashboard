<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; img-src 'self' data: https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>업무 대시보드</title>
<script>
  /* ▼▼▼ 설치할 때 이 한 줄만 바꾸세요: 스프레드시트 메뉴 「API 주소 보기」의 주소 ▼▼▼ */
  const API_URL = 'https://script.google.com/macros/s/AKfycbxahKFdt33lWLXvkvmGhJunNfE-7x-CqOohsEHISBqi70vyZmUDKocmxm5nBrUcPXzM/exec';
  /* ▲▲▲ 그 외에는 고칠 필요 없습니다 ▲▲▲ */
  const APP_API_VERSION = 2;
</script>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#6b7280; --line:#e3e6ea;
    --accent:#2563eb; --accent-weak:#e8f0fe; --red:#dc2626; --red-weak:#fde8e8;
    --amber:#b45309; --amber-weak:#fef3c7; --green:#15803d; --green-weak:#dcfce7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#111418; --card:#1b1f26; --text:#e6e8eb; --muted:#9aa3ad; --line:#2b313a;
      --accent:#6ea0ff; --accent-weak:#1e2a44; --red:#f87171; --red-weak:#3a1d1d;
      --amber:#fbbf24; --amber-weak:#3a2f12; --green:#4ade80; --green-weak:#15301f;
    }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font-size:15px; line-height:1.45;
         font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif }
  .wrap { max-width:960px; margin:0 auto; padding:16px }
  header { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap }
  header h1 { font-size:20px; margin:0; flex:1; min-width:180px }
  .who { color:var(--muted); font-size:13px }
  .role { font-size:11.5px; border-radius:6px; padding:1px 6px; background:var(--accent-weak); color:var(--accent); margin-left:4px }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:7px 12px }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff }
  button.ghost { border-color:transparent; background:transparent }
  button:disabled { opacity:.55; cursor:default }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px }
  textarea, input, select { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100% }
  input:disabled, select:disabled { opacity:.65 }
  textarea { min-height:72px; resize:vertical }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; align-items:center; flex-wrap:wrap }
  .hint { color:var(--muted); font-size:12.5px; flex:1; min-width:200px }
  .mic.on { background:var(--red); border-color:var(--red); color:#fff }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0 10px }
  #chips { display:flex; flex-wrap:wrap; gap:6px }
  .chip { border-radius:999px; padding:4px 11px; font-size:13px }
  .chip.sel { background:var(--accent); color:#fff; border-color:var(--accent) }
  .tabs { display:flex; gap:4px; margin-left:auto }
  .tab.sel { background:var(--text); color:var(--bg); border-color:var(--text) }
  .group h3 { font-size:13px; color:var(--muted); margin:16px 2px 6px; font-weight:600 }
  .group.over h3 { color:var(--red) }
  .card { display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px }
  .check { width:26px; height:26px; padding:0; border-radius:50%; flex:none; color:transparent; margin-top:1px }
  .check:hover { color:var(--green); border-color:var(--green) }
  .card .body { flex:1; min-width:0 }
  .card .title { font-weight:600; word-break:break-word }
  .meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; font-size:12.5px }
  .tag { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:1px 7px; color:var(--muted) }
  .tag.plain { border:none; background:none; padding-left:2px }
  .tag.person { color:var(--accent); background:var(--accent-weak); border-color:transparent }
  .tag.over { color:var(--red); background:var(--red-weak); border-color:transparent; font-weight:600 }
  .tag.today { color:var(--amber); background:var(--amber-weak); border-color:transparent; font-weight:600 }
  .tag.hi { color:var(--red); border-color:var(--red) }
  .del { color:var(--muted); padding:2px 8px }
  .done .title { color:var(--muted); text-decoration:line-through }
  .empty { text-align:center; color:var(--muted); padding:30px 0 }
  .note { color:var(--muted); font-size:12.5px; margin:4px 2px 10px }
  #jobs:empty { display:none }
  #jobs { margin-top:10px; border-top:1px solid var(--line); padding-top:8px }
  .job { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--muted); padding:3px 0 }
  .job .txt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .job.err { color:var(--red) }
  .job button { padding:2px 8px; font-size:12.5px }
  .ptask { border:1px dashed var(--line); border-radius:10px; padding:10px; margin-bottom:8px }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px }
  .grid .wide { grid-column:1 / -1 }
  label.small { font-size:12px; color:var(--muted); display:block; margin-bottom:3px }
  .form section { margin-bottom:20px }
  .form h2 { font-size:16px; margin:0 0 4px }
  .form p.desc { color:var(--muted); font-size:13px; margin:0 0 10px }
  .lrow { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap }
  .lrow input[type=checkbox] { width:auto }
  .inline { display:flex; gap:4px; align-items:center; font-size:13px; white-space:nowrap }
  .urow { display:grid; grid-template-columns: 1.2fr 1.6fr 90px 90px 80px; gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13.5px }
  .urow .sub { color:var(--muted); font-size:12px }
  @media (max-width:640px) { .urow { grid-template-columns: 1fr 1fr; } }
  .center { max-width:440px; margin:8vh auto 0; text-align:center }
  .center .panel { padding:28px 22px }
  .center h1 { font-size:22px; margin:0 0 6px }
  .center p { color:var(--muted); margin:6px 0 18px }
  #gbtn { display:flex; justify-content:center; min-height:44px }
  .err-box { color:var(--red); background:var(--red-weak); border-radius:8px; padding:10px; margin-top:14px; font-size:14px; text-align:left }
  .ok-box { color:var(--green); background:var(--green-weak); border-radius:8px; padding:10px; margin-top:14px; font-size:14px }
  .codein { font-size:26px; letter-spacing:6px; text-align:center; text-transform:uppercase; font-family:ui-monospace, Menlo, monospace }
  .banner { background:var(--amber-weak); color:var(--amber); border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:13.5px; display:flex; gap:8px; align-items:center }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#111; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; display:none; max-width:90vw; z-index:10 }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px }
  @keyframes spin { to { transform:rotate(360deg) } }
  .clock { display:none; font-size:22px; color:var(--muted); font-variant-numeric:tabular-nums }
  body.tv { font-size:20px }
  body.tv .wrap { max-width:1500px }
  body.tv .no-tv { display:none !important }
  body.tv .clock { display:block }
  body.tv header h1 { font-size:30px }
  body.tv .meta { font-size:16px }
  @media (max-width:560px) { .tabs { margin-left:0 } }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty"><span class="spinner"></span> 불러오는 중…</div></div>
<div id="toast"></div>

<script>
'use strict';
const S = {
  token:'', boot:null, open:[], done:[], rev:-1, filter:'all', tab:'open',
  preview:null, jobs:[], jobSeq:0, autoSave:false, tv:false, draft:null,
  invite:'', link:'', pollT:null, fails:0, view:'main', usersData:null
};
const app = document.getElementById('app');
const $ = sel => document.querySelector(sel);
const TOKEN_KEY = 'td_token:' + API_URL;
const RANK = { '보기':1, '쓰기':2, '관리자':3 };

/* ════════ 유틸 ════════ */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 3500); }
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k, v){ try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch(e){} }
function uid(){ try { return crypto.randomUUID(); } catch(e){ return Date.now().toString(36) + Math.random().toString(36).slice(2); } }
function localToday(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function cleanUrl(...keys){
  const u = new URL(location.href); keys.forEach(k => u.searchParams.delete(k));
  history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
}
function cfg(){ return S.boot.config; }
function me(){ return S.boot.user; }
function people(){ return cfg().people || []; }
function activeFields(){ return cfg().fields.filter(f => f.active); }
function canWrite(){ return RANK[me().role] >= 2; }
function isAdmin(){ return me().role === '관리자'; }

/* ════════ 서버 호출 ════════
 * CORS 사전 확인을 피하려고 text/plain으로 보내고, 토큰은 본문에 넣습니다. */
async function api(action, params, timeoutMs){
  const body = Object.assign({ action }, params || {});
  if (S.token) body.token = S.token;
  let res, j;
  try {
    const ac = new AbortController();
    const to = setTimeout(() => ac.abort(), timeoutMs || 60000);   // 응답이 없으면 무한정 기다리지 않음
    try {
      res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ac.signal });
    } finally { clearTimeout(to); }
  } catch(e){
    if (e && e.name === 'AbortError') throw mkErr('TIMEOUT', '서버 응답이 너무 오래 걸려 중단했습니다. 「다시 시도」를 눌러 주세요.');
    throw mkErr('NETWORK', '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.');
  }
  try { j = await res.json(); }
  catch(e){ throw mkErr('SERVER', '서버 응답을 읽지 못했습니다. API 주소와 배포 설정(액세스: 누구나)을 확인하세요.'); }
  if (j.v && j.v !== APP_API_VERSION) showVersionBanner();
  if (!j.ok){
    if ((j.code === 'UNAUTH' || j.code === 'DISABLED') && S.token && !action.startsWith('auth.')) {
      signedOut(j.msg);
    }
    throw mkErr(j.code, j.msg);
  }
  return j.data;
}
function mkErr(code, msg){ const e = new Error(msg); e.code = code; return e; }

function showVersionBanner(){
  if ($('#verBanner')) return;
  const b = document.createElement('div');
  b.id = 'verBanner'; b.className = 'banner';
  b.innerHTML = '새 버전이 있습니다. <button data-act="reload">새로고침</button>';
  app.prepend(b);
}

/* ════════ 시작 · 로그인 ════════ */
(function start(){
  const q = new URLSearchParams(location.search);
  S.invite = (q.get('invite') || '').replace(/[^0-9a-f]/g, '');
  S.link = (q.get('link') || '').replace(/[^0-9a-f]/g, '');
  S.tv = q.get('mode') === 'tv';
  if (S.tv) document.body.classList.add('tv');
  S.autoSave = lsGet('td_autosave') === '1';
  boot();
})();

async function boot(){
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) {
    app.innerHTML = '<div class="center"><div class="panel"><h1>설정 필요</h1><p>index.html 맨 위의 <b>API_URL</b>에 Apps Script 웹앱 주소를 넣어 주세요.</p></div></div>';
    return;
  }
  S.token = lsGet(TOKEN_KEY);
  if (S.token){
    try { S.boot = await api('me'); return afterLogin(); }
    catch(e){
      if (e.code !== 'UNAUTH' && e.code !== 'DISABLED') return showLogin(e.message);
      S.token = ''; lsSet(TOKEN_KEY, '');
    }
  }
  showLogin();
}

async function showLogin(errText){
  stopPolling();
  let info = { orgName:'', clientId:'' };
  try { info = await api('info'); } catch(e){ errText = errText || e.message; }
  const lead = S.link ? '데스크톱 앱을 연결하려면 먼저 로그인하세요.'
    : S.invite ? '초대받은 이메일의 구글 계정으로 로그인하세요.'
    : '기관 구글 계정 또는 초대받은 계정으로 로그인하세요.';
  app.innerHTML = `<div class="center"><div class="panel">
    <h1>${esc(info.orgName ? info.orgName + ' ' : '')}업무 대시보드</h1>
    <p>${lead}</p>
    <div id="gbtn">${info.clientId ? '<span class="spinner"></span>' : ''}</div>
    ${!info.clientId && !errText ? '<div class="err-box">관리자가 아직 로그인 설정(OAuth 클라이언트 ID)을 마치지 않았습니다.</div>' : ''}
    <div id="loginMsg">${errText ? '<div class="err-box">' + esc(errText) + '</div>' : ''}</div>
  </div></div>`;
  if (info.clientId) loadGis(() => {
    google.accounts.id.initialize({ client_id: info.clientId, callback: onCredential, auto_select: false, cancel_on_tap_outside: true });
    $('#gbtn').innerHTML = '';
    google.accounts.id.renderButton($('#gbtn'), { theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'ko', width: 260 });
  });
}

function loadGis(cb){
  if (window.google && google.accounts && google.accounts.id) return cb();
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = cb;
  s.onerror = () => { $('#loginMsg').innerHTML = '<div class="err-box">구글 로그인 모듈을 불러오지 못했습니다. 광고 차단 확장 프로그램을 끄고 다시 시도하세요.</div>'; };
  document.head.appendChild(s);
}

async function onCredential(resp){
  $('#loginMsg').innerHTML = '<div class="note"><span class="spinner"></span> 확인 중…</div>';
  try {
    const r = await api('auth.google', { idToken: resp.credential, invite: S.invite || undefined });
    S.token = r.token; lsSet(TOKEN_KEY, r.token);
    S.boot = r.me;
    if (S.invite){ S.invite = ''; cleanUrl('invite'); }
    afterLogin();
  } catch(e){
    $('#loginMsg').innerHTML = '<div class="err-box">' + esc(e.message) +
      (e.code === 'INVITE_MISMATCH' || e.code === 'NOT_INVITED' ? '<br><br>위 버튼을 다시 눌러 다른 계정을 선택할 수 있습니다.' : '') + '</div>';
  }
}

function signedOut(msg){
  S.token = ''; S.boot = null; lsSet(TOKEN_KEY, '');
  try { google.accounts.id.disableAutoSelect(); } catch(e){}
  showLogin(msg);
}

async function logout(){
  try { await api('auth.logout'); } catch(e){}
  signedOut('');
}

function afterLogin(){
  if (S.link) return renderLinkApprove();
  route();
}

/* ════════ 데스크톱 앱 연결 승인 ════════ */
function renderLinkApprove(){
  stopPolling();
  app.innerHTML = `<div class="center"><div class="panel">
    <h1>데스크톱 앱 연결</h1>
    <p><b>${esc(me().email)}</b> 계정으로 앱을 연결합니다.<br>앱 화면에 표시된 6자리 코드를 입력하세요.</p>
    <input id="ucode" class="codein" maxlength="7" placeholder="ABC-123" autocomplete="off" autofocus>
    <div class="actions" style="justify-content:center;margin-top:14px">
      <button data-act="linkCancel">취소</button>
      <button class="primary" id="linkOk" data-act="linkOk">연결 승인</button>
    </div>
    <div class="note" style="margin-top:14px">본인이 직접 앱에서 「로그인」을 누른 경우에만 승인하세요. 다른 사람이 보내 준 링크라면 취소하세요.</div>
    <div id="linkMsg"></div>
  </div></div>`;
}

async function approveLink(){
  const code = ($('#ucode').value || '').trim();
  if (code.replace(/[^A-Za-z0-9]/g, '').length !== 6) return toast('6자리 코드를 입력하세요.');
  const btn = $('#linkOk'); btn.disabled = true;
  try {
    await api('auth.linkApprove', { code: S.link, userCode: code });
    S.link = ''; cleanUrl('link');
    app.innerHTML = `<div class="center"><div class="panel"><h1>연결 완료</h1>
      <div class="ok-box">앱이 곧 로그인됩니다. 이 창은 닫아도 됩니다.</div>
      <div class="actions" style="justify-content:center;margin-top:14px"><button data-act="toMain">대시보드로 이동</button></div></div></div>`;
  } catch(e){
    btn.disabled = false;
    $('#linkMsg').innerHTML = '<div class="err-box">' + esc(e.message) + '</div>';
    if (e.code === 'LINK_EXPIRED'){ S.link = ''; cleanUrl('link'); btn.disabled = true; }
  }
}

/* ════════ 화면 전환 ════════ */
function route(){
  S.view = 'main';
  if (!cfg().setupDone){
    if (isAdmin()) return renderSettings(true);
    app.innerHTML = '<div class="center"><div class="panel"><h1>준비 중</h1><p>관리자가 아직 처음 설정을 하지 않았습니다. 설정이 끝나면 새로고침하세요.</p><button data-act="logout">로그아웃</button></div></div>';
    return;
  }
  renderMain();
  loadTasks();
  startPolling();
  if (!S.clockT) S.clockT = setInterval(tick, 20000);
}

/* ── 변경 번호만 가볍게 확인 → 바뀌었을 때만 목록 받기 ── */
function startPolling(){ stopPolling(); schedulePoll(); }
function stopPolling(){ clearTimeout(S.pollT); S.pollT = null; }
function schedulePoll(){
  clearTimeout(S.pollT);
  const base = S.tv ? 45000 : 60000;
  const backoff = Math.pow(2, Math.min(S.fails, 4));       // 실패하면 점점 천천히
  const jitter = (Math.random() * 30000) - 15000;          // 모두가 같은 순간에 몰리지 않게
  S.pollT = setTimeout(poll, base * backoff + jitter);
}
async function poll(){
  if (!S.boot || S.view !== 'main') return;
  if (document.hidden || S.preview) return schedulePoll();
  try {
    const r = await api('rev');
    if (r.rev !== S.rev) await loadTasks();
    S.fails = 0;
  } catch(e){ S.fails++; }
  schedulePoll();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.boot && S.view === 'main' && S.pollT){
    clearTimeout(S.pollT); S.pollT = setTimeout(poll, 500);
  }
});

async function loadTasks(){
  try { apply(await api('tasks.list')); }
  catch(e){ if (e.code !== 'UNAUTH' && e.code !== 'DISABLED') toast('불러오기 실패: ' + e.message); }
}
function apply(r){ S.open = r.open; S.done = r.done; S.rev = r.rev; renderList(); }

function tick(){
  const el = $('#clock'); if (!el) return;
  const d = new Date();
  el.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ════════ 메인 화면 ════════ */
const WD = ['일','월','화','수','목','금','토'];
function ymd(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2]-1, +m[3]) : NaN; }
function dayDiff(a, b){ return Math.round((ymd(b) - ymd(a)) / 86400000); }
function mdLabel(s){ const t = ymd(s); if (isNaN(t)) return s; const d = new Date(t); return (d.getUTCMonth()+1) + '/' + d.getUTCDate() + '(' + WD[d.getUTCDay()] + ')'; }
function dueInfo(due){
  if (!due) return null;
  const d = dayDiff(localToday(), due);
  if (isNaN(d)) return { cls:'', text:due, d:null };
  const md = mdLabel(due);
  if (d < 0) return { cls:'over', text:`${-d}일 지남 · ${md}`, d };
  if (d === 0) return { cls:'today', text:`오늘 · ${md}`, d };
  if (d === 1) return { cls:'today', text:`내일 · ${md}`, d };
  return { cls:'', text:`D-${d} · ${md}`, d };
}
function prioRank(t){
  const f = cfg().fields.find(x => x.label === '우선순위' && x.type === 'select' && x.active);
  if (!f) return 0;
  const i = f.options.indexOf(t['우선순위']);
  return i < 0 ? f.options.length : i;
}

function applyFilter(list){
  const f = S.filter;
  if (f === 'all') return list;
  if (f === 'me') return list.filter(t => t['담당자'] === me().name);
  if (f === 'none') return list.filter(t => !t['담당자']);
  if (f.startsWith('p:')) return list.filter(t => t['담당자'] === f.slice(2));
  return list;
}

function renderChips(){
  const el = $('#chips'); if (!el) return;
  const opts = [['all','전체']].concat(S.tv ? [] : [['me','내 일']])
    .concat(people().map(p => ['p:' + p.name, p.name])).concat([['none','미정']]);
  el.innerHTML = opts.map(([v, l]) => `<button class="chip ${S.filter === v ? 'sel' : ''}" data-act="filter" data-v="${esc(v)}">${esc(l)}</button>`).join('');
}

function renderList(){
  const el = $('#list'); if (!el) return;
  renderChips();
  const cnt = $('#cntOpen'); if (cnt) cnt.textContent = '(' + S.open.length + ')';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('sel', b.dataset.tab === S.tab));
  if (S.tab === 'done' && !S.tv){
    const items = applyFilter(S.done);
    el.innerHTML = '<div class="note">최근 완료 100건입니다. 전체 기록은 스프레드시트 「완료」 시트에 보관됩니다.</div>' +
      (items.length ? items.map(doneCard).join('') : '<div class="empty">완료된 항목이 없습니다.</div>');
    return;
  }
  const items = applyFilter(S.open).map(t => ({ t, info: dueInfo(t['마감일']) }));
  const dv = x => (x.info && x.info.d != null) ? x.info.d : 1e9;
  items.sort((a, b) => dv(a) - dv(b) || prioRank(a.t) - prioRank(b.t) || String(a.t['등록일시']).localeCompare(String(b.t['등록일시'])));
  const groups = [
    ['over','지연', x => dv(x) < 0], ['today','오늘', x => dv(x) === 0],
    ['week','7일 이내', x => dv(x) >= 1 && dv(x) <= 7], ['later','이후', x => dv(x) > 7 && dv(x) < 1e9],
    ['none','마감일 없음', x => dv(x) === 1e9]
  ];
  const html = groups.map(([k, label, test]) => {
    const g = items.filter(test);
    return g.length ? `<div class="group ${k}"><h3>${label} · ${g.length}</h3>${g.map(x => taskCard(x.t, x.info)).join('')}</div>` : '';
  }).join('');
  el.innerHTML = html || '<div class="empty">남은 일이 없습니다. 🎉</div>';
}

function taskCard(t, info){
  const extra = activeFields().filter(f => !f.builtin && t[f.label]).map(f => {
    const hi = f.label === '우선순위' && f.options && t[f.label] === f.options[0];
    return `<span class="tag ${hi ? 'hi' : ''}" title="${esc(f.label)}">${esc(t[f.label])}</span>`;
  }).join('');
  const canDel = !S.tv && canWrite() && (isAdmin() || t.mine);
  return `<div class="card">
    ${canWrite() ? `<button class="check no-tv" data-act="complete" data-id="${esc(t.ID)}" title="완료 처리">✓</button>` : ''}
    <div class="body">
      <div class="title" title="${esc(t['원문'] ? '원문: ' + t['원문'] : '')}">${esc(t['할일'])}</div>
      <div class="meta">
        <span class="tag person">${esc(t['담당자'] || '담당자 미정')}</span>
        ${info ? `<span class="tag ${info.cls}">${esc(info.text)}</span>` : ''}
        ${extra}
        <span class="tag plain no-tv">등록 ${esc(t['등록자'] || '')}</span>
      </div>
    </div>
    ${canDel ? `<button class="ghost del" data-act="del" data-id="${esc(t.ID)}" title="삭제">×</button>` : ''}
  </div>`;
}

function doneCard(t){
  return `<div class="card done"><div class="body">
      <div class="title">${esc(t['할일'])}</div>
      <div class="meta"><span class="tag person">${esc(t['담당자'] || '미정')}</span>
        <span class="tag">완료 ${esc(t['완료자'] || '')} · ${esc(t['완료일시'] || '')}</span>
        ${t['마감일'] ? `<span class="tag">마감 ${esc(t['마감일'])}</span>` : ''}</div></div>
    ${canWrite() ? `<button data-act="reopen" data-id="${esc(t.ID)}">되돌리기</button>` : ''}</div>`;
}

/* ════════ 입력 · 미리보기 ════════ */
function submitInput(){
  const ta = $('#inp'); const text = ta.value.trim();
  if (!text) return toast('내용을 입력하세요.');
  ta.value = ''; ta.focus();
  runJob({ id: ++S.jobSeq, text, status:'run', err:'' });
}

async function runJob(job){
  if (S.jobs.indexOf(job) < 0) S.jobs.push(job);
  job.status = 'run'; job.err = ''; job.started = Date.now(); renderJobs();
  if (!S.jobTick) S.jobTick = setInterval(() => { if (S.jobs.some(j => j.status === 'run')) renderJobs(); }, 1000);
  try {
    let tasks;
    if (job.audio){
      const r = await api('tasks.parseAudio', { audio: job.audio, today: localToday() }, 120000);
      if (!r.transcript) throw mkErr('EMPTY', '말소리를 알아듣지 못했습니다. 조금 더 또렷하게 다시 녹음해 주세요.');
      job.text = r.transcript; job.label = '🎤 ' + r.transcript; job.audio = null;   // 이후 재시도·고쳐 쓰기는 글자로
      tasks = r.tasks;
    } else {
      tasks = await api('tasks.parse', { text: job.text, today: localToday() }, 90000);
    }
    if (!tasks.length) throw mkErr('EMPTY', '할 일을 찾지 못했습니다. 조금 더 구체적으로 적어 주세요.');
    tasks.forEach(t => t._raw = job.text);
    if (S.autoSave){
      apply(await api('tasks.save', { tasks, reqId: uid() }));
      toast(tasks.length + '건을 저장했습니다: ' + tasks.map(t => t['할일']).join(', '), 4000);
    } else {
      syncPreview(); S.preview = (S.preview || []).concat(tasks); renderPreview();
    }
    S.jobs = S.jobs.filter(j => j !== job);
  } catch(e){ job.status = 'err'; job.err = e.message; }
  renderJobs();
}

function renderJobs(){
  const el = $('#jobs'); if (!el) return;
  el.innerHTML = S.jobs.map(j => j.status === 'run'
    ? `<div class="job"><span class="spinner"></span><span class="txt">${j.audio ? '받아쓰고 정리 중' : '정리 중'} (${Math.floor((Date.now() - (j.started || Date.now())) / 1000)}초): ${esc(j.label || j.text)}</span></div>`
    : `<div class="job err"><span>⚠️</span><span class="txt" title="${esc(j.err)}">${esc(j.err)} — ${esc(j.label || j.text)}</span>
        <button data-act="jretry" data-i="${j.id}">다시 시도</button>${j.text ? `<button data-act="jedit" data-i="${j.id}">고쳐 쓰기</button>` : ''}
        <button class="ghost" data-act="jdrop" data-i="${j.id}" title="버리기">×</button></div>`).join('');
}

function fieldInput(f, v){
  v = v || '';
  const a = `data-f="${esc(f.label)}"`;
  let inp;
  if (f.type === 'person') inp = `<select ${a}><option value="">미정</option>${people().map(p => `<option ${p.name === v ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`;
  else if (f.type === 'select') inp = `<select ${a}><option value=""></option>${(f.options || []).map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'date') inp = `<input type="date" ${a} value="${esc(v)}">`;
  else inp = `<input type="text" ${a} value="${esc(v)}">`;
  return `<div class="${f.label === '할일' ? 'wide' : ''}"><label class="small">${esc(f.label)}</label>${inp}</div>`;
}

function renderPreview(){
  const el = $('#preview'); if (!el) return;
  if (!S.preview){ el.innerHTML = ''; return; }
  const fs = activeFields();
  el.innerHTML = `<div class="panel"><strong>AI가 정리한 내용 — 확인하고 고친 뒤 저장하세요</strong>
    <div style="margin-top:10px">${S.preview.map((t, i) => `<div class="ptask">
      <div class="grid">${fs.map(f => fieldInput(f, t[f.label])).join('')}</div>
      <div style="text-align:right;margin-top:6px"><button class="ghost" data-act="pdel" data-i="${i}">이 항목 빼기</button></div></div>`).join('')}</div>
    <div class="actions"><button data-act="pcancel">취소</button>
      <button class="primary" id="psave" data-act="psave">저장 (${S.preview.length}건)</button></div></div>`;
}

function syncPreview(){
  if (!S.preview) return;
  document.querySelectorAll('.ptask').forEach((p, i) => {
    const t = S.preview[i]; if (!t) return;
    p.querySelectorAll('[data-f]').forEach(x => t[x.dataset.f] = x.value.trim());
  });
}

async function savePreview(){
  syncPreview();
  const batch = S.preview || [];
  const tasks = batch.filter(t => t['할일']);
  if (!tasks.length) return toast('저장할 항목이 없습니다.');
  const btn = $('#psave'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 저장 중';
  try {
    apply(await api('tasks.save', { tasks, reqId: uid() }));
    syncPreview();
    const rest = (S.preview || []).slice(batch.length);
    S.preview = rest.length ? rest : null; renderPreview();
    toast(tasks.length + '건을 저장했습니다.');
  } catch(e){ toast(e.message, 6000); btn.disabled = false; btn.textContent = '저장'; }
}

async function act(action, id, okMsg){
  const list = action === 'tasks.reopen' ? S.done : S.open;
  const i = list.findIndex(t => t.ID === id);
  if (i >= 0){ list.splice(i, 1); renderList(); }
  try {
    const r = await api(action, { id, reqId: uid() });
    apply(r);
    toast(r.already ? '다른 사람이 이미 처리한 항목입니다.' : okMsg);
  } catch(e){ toast(e.message, 6000); loadTasks(); }
}

/* ════════ 음성 입력 ════════ */
/* 브라우저 음성인식(구글 서버)에 의존하지 않고, 녹음한 소리를 우리 서버 → Gemini로 보내
 * 받아쓰기와 할 일 정리를 한 번에 합니다. Chrome·Safari·데스크톱 앱 어디서나 같은 방식으로 동작합니다.
 * 녹음은 16kHz 모노 WAV로 줄여 보내므로 1분에 약 2.5MB입니다. */
const MIC_MAX_SEC = 90;
const MIC_FALLBACK = '입력창에 커서를 둔 채 운영체제 받아쓰기를 쓰셔도 됩니다 (맥: 시스템 설정 → 키보드 → 받아쓰기 / 윈도우: Win+H).';
const mic = { on:false, stream:null, ctx:null, src:null, node:null, chunks:[], rate:48000, peak:0, level:0, t0:0, timer:0 };

function micStatus(text, isErr){
  const el = $('#micStatus'); if (!el) return;
  el.textContent = text || '';
  el.style.display = text ? 'block' : 'none';
  el.style.color = isErr ? 'var(--red)' : '';
}
function fmtSec(s){ s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

async function toggleMic(){
  if (mic.on) return finishRecording();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return micStatus('이 브라우저는 녹음을 지원하지 않습니다. ' + MIC_FALLBACK, true);
  try {
    mic.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch(e){
    const why = e.name === 'NotAllowedError' ? '마이크 권한이 차단되어 있습니다. 주소창 왼쪽 아이콘 → 마이크 「허용」 후 새로고침하세요.'
      : e.name === 'NotFoundError' ? '마이크 장치를 찾지 못했습니다.' : '마이크를 열 수 없습니다(' + e.name + ').';
    return micStatus(why + ' ' + MIC_FALLBACK, true);
  }
  try {
    mic.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (mic.ctx.state === 'suspended') await mic.ctx.resume();
    mic.rate = mic.ctx.sampleRate;
    mic.src = mic.ctx.createMediaStreamSource(mic.stream);
    mic.node = mic.ctx.createScriptProcessor(4096, 1, 1);
    mic.chunks = []; mic.peak = 0; mic.level = 0;
    mic.node.onaudioprocess = ev => {
      if (!mic.on) return;
      const d = ev.inputBuffer.getChannelData(0);
      mic.chunks.push(new Float32Array(d));
      let m = 0; for (let i = 0; i < d.length; i += 8) m = Math.max(m, Math.abs(d[i]));
      mic.level = m; mic.peak = Math.max(mic.peak, m);
    };
    mic.src.connect(mic.node); mic.node.connect(mic.ctx.destination);
  } catch(e){ releaseMic(); return micStatus('녹음을 시작하지 못했습니다. ' + MIC_FALLBACK, true); }

  mic.on = true; mic.t0 = Date.now();
  micStatus('녹음 중… 말씀하세요. 다 말했으면 「■ 멈춤」을 누르세요. (최대 ' + MIC_MAX_SEC + '초)');
  const tick = () => {
    if (!mic.on) return;
    const btn = $('#mic');
    if (btn){
      btn.classList.add('on');
      btn.textContent = '■ 멈춤 ' + fmtSec((Date.now() - mic.t0) / 1000);
      btn.style.boxShadow = `0 0 0 ${Math.min(10, mic.level * 40).toFixed(1)}px rgba(220,38,38,.35)`;
    }
    if (Date.now() - mic.t0 >= MIC_MAX_SEC * 1000) return finishRecording();
    mic.timer = setTimeout(tick, 100);
  };
  tick();
}

function releaseMic(){
  mic.on = false; clearTimeout(mic.timer);
  try { if (mic.node){ mic.node.onaudioprocess = null; mic.node.disconnect(); } if (mic.src) mic.src.disconnect(); } catch(e){}
  if (mic.stream) mic.stream.getTracks().forEach(t => t.stop());
  if (mic.ctx){ try { mic.ctx.close(); } catch(e){} }
  mic.stream = mic.ctx = mic.src = mic.node = null;
  const btn = $('#mic'); if (btn){ btn.classList.remove('on'); btn.textContent = '🎤'; btn.style.boxShadow = ''; }
}

function finishRecording(){
  const secs = (Date.now() - mic.t0) / 1000, chunks = mic.chunks, rate = mic.rate, peak = mic.peak;
  mic.chunks = [];
  releaseMic();
  if (secs < 0.8) return micStatus('너무 짧습니다. 🎤를 누르고 말한 뒤 「■ 멈춤」을 눌러 주세요.', true);
  if (peak < 0.01) return micStatus('소리가 거의 녹음되지 않았습니다. 맥 시스템 설정 → 개인정보 보호 및 보안 → 마이크에서 Chrome이 켜져 있는지, 입력 장치가 맞는지 확인하세요.', true);
  micStatus('');
  runJob({ id: ++S.jobSeq, text: '', label: '🎤 음성 ' + fmtSec(secs), audio: encodeWavBase64(chunks, rate, Math.min(16000, rate)), status: 'run', err: '' });
}

/** Float32 조각들 → 16kHz 16bit 모노 WAV → base64 */
function encodeWavBase64(chunks, inRate, outRate){
  let len = 0; chunks.forEach(c => len += c.length);
  const all = new Float32Array(len); let off = 0;
  chunks.forEach(c => { all.set(c, off); off += c.length; });
  const ratio = inRate / outRate, outLen = Math.floor(len / ratio);
  const buf = new ArrayBuffer(44 + outLen * 2), dv = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + outLen * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, outLen * 2, true);
  for (let i = 0; i < outLen; i++){
    const s = Math.floor(i * ratio), e = Math.max(s + 1, Math.min(len, Math.floor((i + 1) * ratio)));
    let sum = 0; for (let j = s; j < e; j++) sum += all[j];
    const v = Math.max(-1, Math.min(1, sum / (e - s)));
    dv.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
  }
  const bytes = new Uint8Array(buf); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

    .map(r => `<option ${r === selected ? 'selected' : ''}>${r}</option>`).join('');
}

function drawUsers(){
  const d = S.usersData, myRank = RANK[me().role];
  app.innerHTML = `<div class="panel form">
    <header><h1>사용자 · 초대</h1><button data-act="uclose">닫기</button></header>
    <section><h2>초대하기</h2>
      <p class="desc">초대 링크는 그 이메일 계정에서만, 한 번만 쓸 수 있고 7일 후 만료됩니다. 자신보다 높은 역할로는 초대할 수 없습니다.</p>
      <div class="lrow">
        <input id="ivEmail" type="email" placeholder="이메일 주소" style="flex:2;min-width:200px">
        <select id="ivRole" style="width:auto">${roleOptions('쓰기', myRank)}</select>
        ${isAdmin() ? '<label class="inline"><input type="checkbox" id="ivCan"> 초대 가능</label>' : ''}
        <button class="primary" id="ivBtn" data-act="invite">초대 메일 보내기</button>
      </div></section>
    <section><h2>대기 중인 초대</h2>
      ${d.invites.length ? d.invites.map(v => `<div class="lrow"><span style="flex:1">${esc(v.email)} · ${esc(v.role)}${v.canInvite ? ' · 초대 가능' : ''} <span class="note">(만료 ${esc(v.expires)}${isAdmin() ? ', 초대: ' + esc(v.invitedBy) : ''})</span></span>
        <button data-act="revoke" data-id="${esc(v.id)}">취소</button></div>`).join('') : '<div class="note">없음</div>'}
    </section>
    ${isAdmin() ? `<section><h2>사용자</h2>
      <p class="desc">바꾸는 즉시 적용됩니다. 「중지」하면 그 사람의 모든 기기에서 즉시 로그아웃됩니다. 마지막 관리자와 소유자는 바꿀 수 없습니다.</p>
      ${d.users.map(u => `<div class="urow">
        <div><input data-uf="name" data-email="${esc(u.email)}" value="${esc(u.name)}"></div>
        <div>${esc(u.email)}<div class="sub">${u.isOwner ? '소유자' : esc(u.invitedBy)} · ${u.lastSeen ? '최근 ' + esc(u.lastSeen) : '접속 기록 없음'}</div></div>
        <select data-uf="role" data-email="${esc(u.email)}" ${u.isOwner ? 'disabled' : ''}>${roleOptions(u.role, 3)}</select>
        <select data-uf="status" data-email="${esc(u.email)}" ${u.isOwner ? 'disabled' : ''}>
          <option ${u.status === '활성' ? 'selected' : ''}>활성</option><option ${u.status === '중지' ? 'selected' : ''}>중지</option></select>
        <label class="inline"><input type="checkbox" data-uf="canInvite" data-email="${esc(u.email)}" ${u.canInvite || u.role === '관리자' ? 'checked' : ''} ${u.role === '관리자' ? 'disabled' : ''}> 초대</label>
      </div>`).join('')}</section>` : ''}
  </div>`;
}

async function sendInvite(){
  const email = $('#ivEmail').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('이메일 주소를 확인하세요.');
  const btn = $('#ivBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 보내는 중';
  try {
    S.usersData = await api('users.invite', { email, role: $('#ivRole').value, canInvite: !!($('#ivCan') && $('#ivCan').checked), reqId: uid() });
    drawUsers(); toast(email + ' 님에게 초대 메일을 보냈습니다.');
  } catch(e){ toast(e.message, 6000); btn.disabled = false; btn.textContent = '초대 메일 보내기'; }
}

async function updateUser(email, patch){
  try { S.usersData = await api('users.update', Object.assign({ email }, patch)); toast('저장했습니다.'); }
  catch(e){ toast(e.message, 6000); }
  drawUsers();
}

/* ════════ 설정 (처음 설정 겸용) ════════ */
function renderSettings(wizard){
  stopPolling(); S.view = 'settings';
  const c = cfg();
  S.draft = {
    wizard,
    orgName: c.orgName || '',
    people: (c.people.length ? c.people : [{ name: me().name, email: me().email }]).map(p => ({ name:p.name, email:p.email || '' })),
    fields: c.fields.map(f => Object.assign({}, f, { saved: wizard ? !!f.builtin : true,
      options: Array.isArray(f.options) ? f.options.join(', ') : (f.options || '') })),
    autoJoinDomain: c.autoJoinDomain || '', autoJoinRole: c.autoJoinRole || '보기',
    webUrl: c.webUrl || (location.origin + location.pathname),
    model: c.model || 'gemini-flash-latest', key: ''
  };
  drawSettings();
}

function syncTop(){
  const d = S.draft; if (!d) return;
  const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  d.orgName = v('s_org'); d.model = v('s_model'); d.key = v('s_key');
  d.autoJoinDomain = v('s_dom'); d.autoJoinRole = v('s_domRole') || '보기'; d.webUrl = v('s_web');
}

function fieldRow(f, i){
  const locked = f.builtin || f.saved;
  const types = { text:'텍스트', select:'선택 목록', date:'날짜', person:'담당자' };
  return `<div class="lrow">
    <input style="flex:1;min-width:110px" data-fl="label" data-i="${i}" value="${esc(f.label)}" ${locked ? 'disabled' : ''} placeholder="항목 이름">
    <select style="width:auto" data-fl="type" data-i="${i}" ${locked ? 'disabled' : ''}>${Object.keys(types).filter(k => k !== 'person' || f.type === 'person')
      .map(k => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${types[k]}</option>`).join('')}</select>
    ${f.type === 'select' ? `<input style="flex:2;min-width:160px" data-fl="options" data-i="${i}" value="${esc(f.options)}" placeholder="보기를 쉼표로 구분">` : ''}
    <label class="inline"><input type="checkbox" data-fl="active" data-i="${i}" ${f.active ? 'checked' : ''} ${f.builtin ? 'disabled' : ''}> 사용</label>
    ${!locked ? `<button class="ghost" data-act="sfrm" data-i="${i}">×</button>` : ''}</div>`;
}

function drawSettings(){
  const d = S.draft;
  app.innerHTML = `<div class="panel form">
    <header><h1>${d.wizard ? '처음 설정' : '설정'}</h1>${d.wizard ? '' : '<button data-act="sclose">닫기</button>'}</header>
    ${d.wizard ? '<p class="desc">관리자 한 명이 한 번만 설정하면 모두가 같은 설정으로 씁니다. 나중에 ⚙️에서 언제든 바꿀 수 있어요.</p>' : ''}
    <section><h2>조직 이름</h2><input id="s_org" value="${esc(d.orgName)}" placeholder="예: 지우선교회"></section>
    <section><h2>담당자</h2><p class="desc">업무를 맡을 사람 목록입니다. 이메일을 넣으면 그 계정으로 로그인한 사람의 「내 일」과 매일 알림이 연결됩니다.</p>
      ${d.people.map((p, i) => `<div class="lrow"><input style="flex:1;min-width:120px" data-p="name" data-i="${i}" value="${esc(p.name)}" placeholder="이름">
        <input style="flex:2;min-width:180px" data-p="email" data-i="${i}" value="${esc(p.email)}" placeholder="이메일 (선택)">
        <button class="ghost" data-act="sprm" data-i="${i}">×</button></div>`).join('')}
      <button data-act="spadd">+ 담당자 추가</button></section>
    <section><h2>항목</h2><p class="desc">할일·담당자·마감일은 고정입니다. 「사용」을 끄면 화면에서 숨겨지고 데이터는 보존됩니다.</p>
      ${d.fields.map(fieldRow).join('')}<button data-act="sfadd">+ 항목 추가</button></section>
    <section><h2>가입 방법</h2>
      <p class="desc">같은 기관(Google Workspace) 계정은 초대 없이 자동 가입시킬 수 있습니다. 비워 두면 초대받은 사람만 들어옵니다. 관리자 지정과 초대는 👥에서 합니다.</p>
      <div class="lrow"><input id="s_dom" value="${esc(d.autoJoinDomain)}" placeholder="예: jiwumission.org" style="flex:2;min-width:180px">
        <select id="s_domRole" style="width:auto">${['보기','쓰기'].map(r => `<option ${r === d.autoJoinRole ? 'selected' : ''}>${r}</option>`).join('')}</select>
        <span class="note">권한으로 자동 가입</span></div></section>
    <section><h2>웹 화면 주소</h2><p class="desc">초대 메일과 앱 연결에 쓰는 이 화면의 주소입니다.</p><input id="s_web" value="${esc(d.webUrl)}"></section>
    <section><h2>Gemini API 키</h2><p class="desc">서버에만 저장되어 다른 사람은 볼 수 없습니다.</p>
      <input id="s_key" type="password" value="${esc(d.key)}" placeholder="${S.boot.hasApiKey ? '저장됨 — 바꿀 때만 입력' : 'AIza… 로 시작하는 키'}"></section>
    <section><h2>모델 (고급)</h2><input id="s_model" value="${esc(d.model)}"></section>
    <div class="actions"><button class="primary" id="ssave" data-act="ssave">${d.wizard ? '설정 완료' : '저장'}</button></div>
  </div>`;
}

async function saveSettingsUI(){
  syncTop();
  const d = S.draft;
  const payload = {
    orgName: d.orgName, people: d.people.filter(p => p.name.trim()),
    fields: d.fields.map(f => ({ label: String(f.label || '').trim(), type: f.type, active: !!f.active,
      options: f.type === 'select' ? String(f.options || '').split(',').map(s => s.trim()).filter(Boolean) : undefined })),
    autoJoinDomain: d.autoJoinDomain, autoJoinRole: d.autoJoinRole, webUrl: d.webUrl.trim(),
    model: d.model.trim(), apiKey: d.key.trim()
  };
  if (!payload.people.length) return toast('담당자를 한 명 이상 입력하세요.');
  if (!S.boot.hasApiKey && !payload.apiKey) return toast('Gemini API 키를 입력하세요.');
  const btn = $('#ssave'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 저장 중';
  try { S.boot = await api('settings.save', payload); S.draft = null; toast('저장했습니다.'); route(); }
  catch(e){ toast(e.message, 7000); btn.disabled = false; btn.textContent = '저장'; }
}

/* ════════ 이벤트 ════════ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, i = +b.dataset.i;
  switch (a){
    case 'reload': return location.reload();
    case 'logout': return logout();
    case 'linkOk': return approveLink();
    case 'linkCancel': S.link = ''; cleanUrl('link'); return route();
    case 'toMain': return route();
    case 'go': return submitInput();
    case 'mic': return toggleMic();
    case 'tv': return window.open(location.origin + location.pathname + '?mode=tv', '_blank', 'noopener');
    case 'settings': return renderSettings(false);
    case 'users': return openUsers();
    case 'uclose': return route();
    case 'invite': return sendInvite();
    case 'revoke': return (async () => { try { S.usersData = await api('invites.revoke', { id }); drawUsers(); toast('초대를 취소했습니다.'); } catch(err){ toast(err.message, 6000); } })();
    case 'filter': S.filter = b.dataset.v; return renderList();
    case 'tab': S.tab = b.dataset.tab; return renderList();
    case 'complete': return act('tasks.complete', id, '완료 처리했습니다.');
    case 'reopen': return act('tasks.reopen', id, '진행중으로 되돌렸습니다.');
    case 'del': if (confirm('이 항목을 삭제할까요? (완료가 아니라 아예 지웁니다)')) act('tasks.delete', id, '삭제했습니다.'); return;
    case 'pdel': syncPreview(); S.preview.splice(i, 1); if (!S.preview.length) S.preview = null; return renderPreview();
    case 'pcancel': S.preview = null; return renderPreview();
    case 'psave': return savePreview();
    case 'jretry': { const j = S.jobs.find(x => x.id === i); if (j) runJob(j); return; }
    case 'jedit': { const j = S.jobs.find(x => x.id === i); if (!j) return;
      const ta = $('#inp'); ta.value = ta.value.trim() ? ta.value.replace(/\s*$/, '\n') + j.text : j.text; ta.focus();
      S.jobs = S.jobs.filter(x => x !== j); return renderJobs(); }
    case 'jdrop': S.jobs = S.jobs.filter(x => x.id !== i); return renderJobs();
    case 'spadd': syncTop(); S.draft.people.push({ name:'', email:'' }); return drawSettings();
    case 'sprm': syncTop(); S.draft.people.splice(i, 1); return drawSettings();
    case 'sfadd': syncTop(); S.draft.fields.push({ label:'', type:'text', active:true, saved:false, options:'' }); return drawSettings();
    case 'sfrm': syncTop(); S.draft.fields.splice(i, 1); return drawSettings();
    case 'ssave': return saveSettingsUI();
    case 'sclose': S.draft = null; return route();
  }
});

document.addEventListener('input', e => {
  const t = e.target, d = S.draft;
  if (d && t.dataset.p) d.people[+t.dataset.i][t.dataset.p] = t.value;
  if (d && t.dataset.fl && t.type !== 'checkbox' && t.tagName !== 'SELECT') d.fields[+t.dataset.i][t.dataset.fl] = t.value;
});

document.addEventListener('change', e => {
  const t = e.target, d = S.draft;
  if (t.id === 'autoSave'){ S.autoSave = t.checked; lsSet('td_autosave', t.checked ? '1' : ''); return; }
  if (t.dataset.uf){
    const v = t.type === 'checkbox' ? t.checked : t.value.trim();
    if (t.dataset.uf === 'status' && v === '중지' && !confirm(t.dataset.email + ' 사용자를 중지할까요? 모든 기기에서 즉시 로그아웃됩니다.')) return drawUsers();
    return updateUser(t.dataset.email, { [t.dataset.uf]: v });
  }
  if (d && t.dataset.fl === 'active') d.fields[+t.dataset.i].active = t.checked;
  if (d && t.dataset.fl === 'type'){ syncTop(); d.fields[+t.dataset.i].type = t.value; drawSettings(); }
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'inp' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); submitInput(); }
  if (e.target.id === 'ivEmail' && e.key === 'Enter'){ e.preventDefault(); sendInvite(); }
  if (e.target.id === 'ucode' && e.key === 'Enter'){ e.preventDefault(); approveLink(); }
});
</script>
</body>
</html>
